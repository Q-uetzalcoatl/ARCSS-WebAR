<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ARC3S - Responsive AR Component Interaction</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: -apple-system, sans-serif; }
        video { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; }
        canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }
        #hud { position: absolute; top: 15px; left: 15px; z-index: 3; display: flex; flex-direction: column; gap: 6px; }
        .badge { background: rgba(0, 0, 0, 0.75); color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 500; width: fit-content; backdrop-filter: blur(4px); }
        #statusBadge { border-left: 4px solid #00bcd4; }
        #startBtn { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 4; padding: 14px 28px; font-size: 16px; border-radius: 8px; background: #007bff; color: white; border: none; font-weight: bold; }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="hud">
        <div id="statusBadge" class="badge">Awaiting Start...</div>
    </div>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>

    <button id="startBtn" onclick="startApp()">Tap to Start AR</button>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output_canvas');
        const statusBadge = document.getElementById('statusBadge');
        const startBtn = document.getElementById('startBtn');

        // 1. THREE.JS INITIALIZATION
        const scene = new THREE.Scene();
        const camera3D = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera3D.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        scene.add(new THREE.AmbientLight(0xffffff, 0.9));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(3, 5, 4);
        scene.add(dirLight);

        // 2. COMPONENT ROOT CONTAINER
        const componentContainer = new THREE.Group();
        
        let fovY = camera3D.fov * (Math.PI / 180);
        let viewHeight = 2 * Math.tan(fovY / 2) * camera3D.position.z;
        let viewWidth = viewHeight * camera3D.aspect;
        
        const dockedPosition = new THREE.Vector3(
            -(viewWidth / 2) + 0.6,
            (viewHeight / 2) - 1.2,
            0
        );
        
        componentContainer.position.copy(dockedPosition);
        scene.add(componentContainer);

        const highlightMat = new THREE.MeshBasicMaterial({ color: 0x00ff66, wireframe: true });
        let highlightBox = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.1), highlightMat);
        highlightBox.visible = false;
        componentContainer.add(highlightBox);

        // 3. MODEL LOADING
        const loader = new THREE.GLTFLoader();
        loader.load('model.glb', (gltf) => {
            const customModel = gltf.scene;

            const rawBox = new THREE.Box3().setFromObject(customModel);
            const rawSize = rawBox.getSize(new THREE.Vector3());
            const maxDim = Math.max(rawSize.x, rawSize.y, rawSize.z);
            
            const targetScale = 0.8 / (maxDim || 1);
            customModel.scale.setScalar(targetScale);

            const scaledBox = new THREE.Box3().setFromObject(customModel);
            const scaledCenter = scaledBox.getCenter(new THREE.Vector3());
            const scaledSize = scaledBox.getSize(new THREE.Vector3());

            customModel.position.sub(scaledCenter);
            
            highlightBox.geometry.dispose(); 
            highlightBox.geometry = new THREE.BoxGeometry(scaledSize.x * 1.15, scaledSize.y * 1.15, scaledSize.z * 1.15);

            componentContainer.add(customModel);
            statusBadge.innerText = "Model Loaded";
        }, undefined, (err) => {
            buildProceduralRAM();
        });

        function buildProceduralRAM() {
            const pcb = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.3, 0.03), new THREE.MeshStandardMaterial({ color: 0x0f3e24, roughness: 0.35 }));
            const pins = new THREE.Mesh(new THREE.BoxGeometry(0.96, 0.045, 0.035), new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.9, roughness: 0.2 }));
            pins.position.y = -0.13;
            pcb.add(pins);
            
            const chipGeo = new THREE.BoxGeometry(0.14, 0.14, 0.025);
            const chipMat = new THREE.MeshStandardMaterial({ color: 0x181818, roughness: 0.5 });
            for (let x = -0.36; x <= 0.36; x += 0.24) {
                const chip = new THREE.Mesh(chipGeo, chipMat);
                chip.position.set(x, 0.03, 0.016);
                pcb.add(chip);
            }
            
            highlightBox.geometry.dispose();
            highlightBox.geometry = new THREE.BoxGeometry(1.1, 0.4, 0.1);
            componentContainer.add(pcb);
        }

        const fingerMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff });
        const thumbMarker = new THREE.Mesh(new THREE.SphereGeometry(0.04, 16, 16), fingerMat);
        const indexMarker = new THREE.Mesh(new THREE.SphereGeometry(0.04, 16, 16), fingerMat);
        thumbMarker.visible = false;
        indexMarker.visible = false;
        scene.add(thumbMarker);
        scene.add(indexMarker);

        // 4. ORIENTATION & RESIZE
        function handleResize() {
            if (!camera3D || !renderer) return;
            camera3D.aspect = window.innerWidth / window.innerHeight;
            camera3D.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            
            fovY = camera3D.fov * (Math.PI / 180);
            viewHeight = 2 * Math.tan(fovY / 2) * camera3D.position.z;
            viewWidth = viewHeight * camera3D.aspect;
            dockedPosition.set(-(viewWidth / 2) + 0.6, (viewHeight / 2) - 1.2, 0);
        }
        window.addEventListener('resize', handleResize);
        window.addEventListener('orientationchange', () => setTimeout(handleResize, 150)); 

        function mapLandmarkTo3D(normX, normY) {
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;
            const videoW = video.videoWidth || screenW;
            const videoH = video.videoHeight || screenH;

            const videoAspect = videoW / videoH;
            const screenAspect = screenW / screenH;

            let scaleX = 1, scaleY = 1;
            let offsetX = 0, offsetY = 0;

            if (screenAspect > videoAspect) {
                scaleY = videoAspect / screenAspect;
                offsetY = (1 - scaleY) / 2;
            } else {
                scaleX = screenAspect / videoAspect;
                offsetX = (1 - scaleX) / 2;
            }

            const adjustedX = (normX - offsetX) / scaleX;
            const adjustedY = (normY - offsetY) / scaleY;

            return {
                x: (adjustedX - 0.5) * viewWidth,
                y: -(adjustedY - 0.5) * viewHeight
            };
        }

        // 5. AFK TIMER & INTERACTION LOOP
        let currentScale = 1.0;
        const targetPos = new THREE.Vector3();
        let lastInteractionTime = Date.now();
        const AFK_LIMIT = 10000; 

        function onResults(results) {
            let isHandActive = false;
            let isPinched = false;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                isHandActive = true;
                const hand = results.multiHandLandmarks[0];
                const thumb = hand[4];
                const index = hand[8];
                const wrist = hand[0];
                const middleTip = hand[12];

                const thumb3D = mapLandmarkTo3D(thumb.x, thumb.y);
                const index3D = mapLandmarkTo3D(index.x, index.y);

                thumbMarker.position.set(thumb3D.x, thumb3D.y, 0);
                indexMarker.position.set(index3D.x, index3D.y, 0);
                thumbMarker.visible = true;
                indexMarker.visible = true;

                const handSpan = Math.hypot(wrist.x - middleTip.x, wrist.y - middleTip.y);
                const targetScale = THREE.MathUtils.lerp(0.5, 2.2, (handSpan - 0.15) / 0.5);
                
                const pinchDist = Math.hypot(thumb.x - index.x, thumb.y - index.y, thumb.z - index.z);

                if (pinchDist < 0.08) {
                    isPinched = true;
                    lastInteractionTime = Date.now(); 
                    
                    highlightBox.visible = true;
                    fingerMat.color.setHex(0x00ff66);

                    const midX = (thumb3D.x + index3D.x) / 2;
                    const midY = (thumb3D.y + index3D.y) / 2;
                    targetPos.set(midX, midY, 0);

                    componentContainer.position.lerp(targetPos, 0.4);
                    currentScale = THREE.MathUtils.lerp(currentScale, Math.max(0.4, Math.min(2.5, targetScale)), 0.2);
                    componentContainer.scale.setScalar(currentScale);
                } 
            }
            
            if (!isPinched) {
                highlightBox.visible = false;
                fingerMat.color.setHex(0x00e5ff);
                
                // RESTORED IDLE ANIMATION: Constantly spins the component so it never stays flat
                componentContainer.rotation.y += 0.01;
                
                if (Date.now() - lastInteractionTime > AFK_LIMIT) {
                    componentContainer.position.lerp(dockedPosition, 0.1);
                    currentScale = THREE.MathUtils.lerp(currentScale, 1.0, 0.1);
                    componentContainer.scale.setScalar(currentScale);
                }
            }

            if (!isHandActive) {
                thumbMarker.visible = false;
                indexMarker.visible = false;
                statusBadge.innerText = "Looking for Hand...";
                statusBadge.style.borderLeftColor = "#ff9800";
            } else {
                statusBadge.innerText = "✋ Hand Tracked (Pinch to Grab)";
                statusBadge.style.borderLeftColor = "#00ff66";
            }

            renderer.render(scene, camera3D);
        }

        // 6. BOOTSTRAP
        function startApp() {
            startBtn.style.display = 'none';
            statusBadge.innerText = "Loading AI Core...";

            try {
                const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
                hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
                hands.onResults(onResults);

                const camera = new Camera(video, {
                    onFrame: async () => { await hands.send({image: video}); },
                    facingMode: 'environment'
                });
                camera.start().then(() => {
                    handleResize();
                    statusBadge.innerText = "Ready: Place hand in frame";
                });
            } catch(e) {
                statusBadge.innerText = "Error: " + e.message;
            }
        }
    </script>
</body>
</html>
